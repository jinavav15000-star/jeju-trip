/* 맑은 제주 팔레트: 하늘빛 바탕, 바다 파랑(다음 갈 곳·선택 탭), 감귤(지도 버튼·다음 표시), 귤잎 초록(다녀옴), 붉은 경고(배·마지막 주문) */
:root {
  --bg: #f2f8fb; --surface: #ffffff; --ink: #0d2a3a; --muted: #3f5f6e; --faint: #7d97a3;
  --line: #d4e6ee; --line-strong: #a8c8d5; --control: #6a93a4;
  --accent-fill: #ff9a2e; --on-accent: #2a1400; --accent-ink: #b25200;
  --sea: #0071b3; --on-sea: #ffffff; --sea-ink: #075f88;
  --leaf: #1c7433; --leaf-soft: #e2f5e0;
  --warn-ink: #b42318; --warn-bg: #fff0ec; --warn-line: #f9c6bb;
  --next-bg: #0071b3; --next-ink: #ffffff; --next-muted: #e3f5fc; --next-track: #3a95cf; --next-done: #bfe6f5;
  --next-btn-bg: #ffffff; --next-btn-ink: #065a80; --next-warn: #b42318; --next-warn-bg: #fff3ef; --next-focus: #ffd25e;
  --sel-bg: #0071b3; --sel-ink: #ffffff; --sel-muted: #e3f5fc; --sel-accent: #fff0dc;
  --cat-meal: #f08a1d; --cat-cafe: #e2557a; --cat-sight: #0e9bb8;
  --cat-shop: #7a5af8;
  --edit-bg: #e4f3fa; --edit-line: #b5dbec;
  --toast-bg: #0d2a3a; --toast-ink: #ffffff; --toast-act: #ffb766; --backdrop: rgba(6, 32, 44, .45);
  --focus: #0a5fb8;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #06202c; --surface: #0c2c3b; --ink: #ecf8fd; --muted: #a9cbd9; --faint: #5f8a9b;
  --line: #194252; --line-strong: #2c6075; --control: #5e95aa;
  --accent-fill: #ffa23d; --on-accent: #2a1400; --accent-ink: #ffb766;
  --sea: #0071b3; --on-sea: #ffffff; --sea-ink: #5cd0f2;
  --leaf: #6fd47e; --leaf-soft: #0f3a2a;
  --warn-ink: #ff9384; --warn-bg: #3a1620; --warn-line: #6a2a33;
  --next-bg: #0071b3; --next-ink: #ffffff; --next-muted: #e3f5fc; --next-track: #3a95cf; --next-done: #bfe6f5;
  --next-btn-bg: #ffffff; --next-btn-ink: #065a80; --next-warn: #b42318; --next-warn-bg: #fff3ef; --next-focus: #ffd25e;
  --sel-bg: #0071b3; --sel-ink: #ffffff; --sel-muted: #e3f5fc; --sel-accent: #fff0dc;
  --cat-meal: #ffa23d; --cat-cafe: #ff7d9c; --cat-sight: #3fd0ee;
  --cat-shop: #b9a4ff;
  --edit-bg: #0d3446; --edit-line: #1f5a72;
  --toast-bg: #ecf8fd; --toast-ink: #06202c; --toast-act: #075f88; --backdrop: rgba(0, 0, 0, .6);
  --focus: #ffd25e;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #06202c; --surface: #0c2c3b; --ink: #ecf8fd; --muted: #a9cbd9; --faint: #5f8a9b;
  --line: #194252; --line-strong: #2c6075; --control: #5e95aa;
  --accent-fill: #ffa23d; --on-accent: #2a1400; --accent-ink: #ffb766;
  --sea: #0071b3; --on-sea: #ffffff; --sea-ink: #5cd0f2;
  --leaf: #6fd47e; --leaf-soft: #0f3a2a;
  --warn-ink: #ff9384; --warn-bg: #3a1620; --warn-line: #6a2a33;
  --next-bg: #0071b3; --next-ink: #ffffff; --next-muted: #e3f5fc; --next-track: #3a95cf; --next-done: #bfe6f5;
  --next-btn-bg: #ffffff; --next-btn-ink: #065a80; --next-warn: #b42318; --next-warn-bg: #fff3ef; --next-focus: #ffd25e;
  --sel-bg: #0071b3; --sel-ink: #ffffff; --sel-muted: #e3f5fc; --sel-accent: #fff0dc;
  --cat-meal: #ffa23d; --cat-cafe: #ff7d9c; --cat-sight: #3fd0ee;
  --cat-shop: #b9a4ff;
  --edit-bg: #0d3446; --edit-line: #1f5a72;
  --toast-bg: #ecf8fd; --toast-ink: #06202c; --toast-act: #075f88; --backdrop: rgba(0, 0, 0, .6);
  --focus: #ffd25e;
  color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 18px; padding-bottom: max(40px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
svg { flex: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* 머리말 */
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 8px; }
.mark-fruit { fill: var(--accent-fill); } .mark-leaf { fill: var(--leaf); }
header p { margin: 0; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }

/* 날짜 탭 */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 1px 0 var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tab { font: inherit; min-height: 58px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 6px 2px; cursor: pointer; display: grid; align-content: center; justify-items: center; line-height: 1.25; -webkit-tap-highlight-color: transparent; }
.tab b { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab span { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.tab .today { color: var(--accent-ink); font-weight: 700; }
.tab[aria-selected="true"] { background: var(--sel-bg); color: var(--sel-ink); border-color: var(--sel-bg); }
.tab[aria-selected="true"] span { color: var(--sel-muted); }
.tab[aria-selected="true"] .today { color: var(--sel-accent); }

/* 그날 머리 */
.day-head { display: grid; gap: 2px; padding-top: 6px; }
.eyebrow { margin: 0; font-size: .875rem; font-weight: 700; color: var(--sea-ink); font-variant-numeric: tabular-nums; }
.day-head h2 { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; }
.route { margin: 0; font-size: 1.05rem; font-weight: 500; color: var(--muted); }
.route .arr { color: var(--sea-ink); padding-inline: 2px; }

.keys { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.keys li { display: grid; gap: 2px; align-content: start; padding-inline: 12px; border-left: 1px solid var(--line); }
.keys li:first-child { padding-left: 0; border-left: 0; }
.keys .kt { font-size: 1.375rem; font-weight: 700; color: var(--sea-ink); line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.keys .kl { font-size: .875rem; color: var(--muted); line-height: 1.35; }
.keys .notime .kl { font-size: 1rem; font-weight: 600; color: var(--ink); }

/* 다음 갈 곳: 바다색 판 */
.next { background: var(--next-bg); color: var(--next-ink); border-radius: 20px; padding: 18px 18px 18px; display: grid; gap: 10px; margin-top: 4px; }
.next :focus-visible { outline-color: var(--next-focus); }
.next-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.next-label { font-size: .875rem; font-weight: 700; color: var(--on-accent); background: var(--accent-fill); border-radius: 999px; padding: 3px 11px; letter-spacing: .02em; }
.next-count { font-size: .875rem; color: var(--next-muted); font-variant-numeric: tabular-nums; }
.prog { display: flex; gap: 3px; margin-top: -2px; }
.prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--next-track); }
.prog i.on { background: var(--next-done); }
.prog i.cur { background: var(--accent-fill); }
.next-name { margin: 2px 0 0; font-size: 1.75rem; font-weight: 700; line-height: 1.25; letter-spacing: -.02em; }
.next-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--next-muted); font-size: .95rem; }
.next-meta .time { color: var(--next-ink); font-size: 1.125rem; font-weight: 700; }
.next-meta .time.warn { color: var(--next-warn); background: var(--next-warn-bg); border-radius: 6px; padding: 0 8px; }
.next .note { margin: 0; color: var(--next-muted); font-size: 1rem; }
.next .note.warn { display: flex; gap: 8px; align-items: flex-start; color: var(--next-warn); background: var(--next-warn-bg); border-radius: 12px; padding: 10px 12px; font-weight: 500; }
.next .note.warn svg { margin-top: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { font: inherit; font-weight: 600; font-size: 1rem; min-height: 52px; padding: 0 18px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; flex: 1 1 150px; -webkit-tap-highlight-color: transparent; }
.btn.primary { background: var(--accent-fill); color: var(--on-accent); border: 0; }
.btn.ghost { background: var(--next-btn-bg); color: var(--next-btn-ink); border: 0; }
.next.alldone { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.next.alldone .next-label { color: var(--leaf); background: var(--leaf-soft); }
.next.alldone .next-count { color: var(--muted); }
.next.alldone .next-name { font-size: 1.4rem; }
.next.alldone .btn.ghost { background: var(--sea); color: var(--on-sea); }
.next.alldone :focus-visible { outline-color: var(--focus); }

/* 일정 목록 */
.list-head { margin: 10px 0 -6px; font-size: .875rem; font-weight: 600; color: var(--muted); }
ol.stops { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.stop { display: grid; grid-template-columns: 30px minmax(0, 1fr) 48px; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); align-items: start; }
.num { width: 28px; height: 28px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; font-size: .85rem; font-weight: 700; color: var(--muted); border: 1.5px solid var(--line-strong); font-variant-numeric: tabular-nums; }
.stop.is-next .num { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.body { min-width: 0; display: grid; gap: 4px; }
.name { font-weight: 600; font-size: 1.125rem; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; font-size: .9rem; color: var(--muted); }
.cat { display: inline-flex; align-items: center; gap: 6px; }
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cat-sight); }
.cat.meal::before { background: var(--cat-meal); }
.cat.cafe::before { background: var(--cat-cafe); border-radius: 2px; }
.cat.shop::before { background: var(--cat-shop); border-radius: 2px; transform: rotate(45deg) scale(.85); }
.time { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.time.warn { color: var(--warn-ink); }
.note { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.5; }
.note.warn { display: flex; gap: 8px; align-items: flex-start; color: var(--warn-ink); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 8px 10px; font-weight: 500; margin-top: 2px; }
.note.warn svg { margin-top: 3px; }
.links { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
.maplink.tel svg { color: var(--leaf); }
.maplink .num-text { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

/* 바로 확인 */
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.quick a { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); font-weight: 600; font-size: .95rem; text-decoration: none; line-height: 1.3; -webkit-tap-highlight-color: transparent; }
.quick a small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }
.quick svg { color: var(--sea-ink); }
.maplink { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: .95rem; font-weight: 600; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.maplink svg { color: var(--sea-ink); }

.check { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--control); background: var(--surface); color: var(--line-strong); cursor: pointer; display: grid; place-items: center; padding: 0; -webkit-tap-highlight-color: transparent; }
.stop.done .check { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); }
.stop.done .name { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1.5px; font-weight: 500; }
.stop.done .num { color: var(--faint); border-color: var(--line); }
.stop.done .meta { color: var(--faint); }
.stop.done .meta .time { color: var(--faint); font-weight: 500; }
.stop.done .note, .stop.done .links { display: none; }

/* 상황별 대비 */
details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
summary { list-style: none; min-height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; cursor: pointer; border-radius: 14px; }
summary::-webkit-details-marker { display: none; }
summary small { display: block; font-weight: 400; font-size: .85rem; color: var(--muted); }
summary svg { color: var(--sea-ink); }
details[open] summary svg { transform: rotate(180deg); }
details ul { margin: 0; padding: 4px 16px 16px; list-style: none; display: grid; gap: 12px; }
details li { font-size: 1rem; line-height: 1.55; padding-top: 12px; border-top: 1px solid var(--line); }
details li b { display: block; font-size: .9rem; color: var(--ink); }

/* 바닥 */
footer { margin-top: 10px; color: var(--muted); font-size: .875rem; display: grid; gap: 6px; }
footer p { margin: 0; }
.reset { justify-self: start; margin-top: 8px; font: inherit; font-size: .95rem; font-weight: 600; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); cursor: pointer; }
.reset.armed { background: var(--warn-bg); border-color: var(--warn-ink); color: var(--warn-ink); }

/* 일정 편집 */
.list-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; scroll-margin-top: 96px; }
.list-bar .list-head { margin: 0; }
.edit-toggle { font: inherit; font-size: .95rem; font-weight: 600; min-height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--sea-ink); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.edit-toggle svg { width: 18px; height: 18px; }
.edit-toggle.on { background: var(--sea); border-color: var(--sea); color: var(--on-sea); }
.edit-banner { background: var(--edit-bg); border: 1px solid var(--edit-line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; margin-top: 4px; scroll-margin-top: 96px; }
.edit-banner p { margin: 0; font-size: .95rem; color: var(--muted); }
.edit-banner b { color: var(--ink); font-size: 1.05rem; }
.edit-banner .sync-note { font-size: .875rem; display: flex; align-items: center; gap: 8px; }
.edit-banner .sync-note::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.edit-banner .sync-note.on::before { background: var(--leaf); }
ol.editlist { border-top: 0; }
.stop.edit { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px 12px 14px; align-items: center; }
.erow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.mini { font: inherit; font-size: .9rem; font-weight: 600; min-height: 40px; padding: 0 12px 0 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mini svg { color: var(--sea-ink); }
.mini.del, .mini.del svg { color: var(--warn-ink); }
.move { display: grid; gap: 6px; }
.move button { width: 48px; height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.move button:disabled { opacity: .3; cursor: default; }
.ins-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.ins-row::before, .ins-row::after { content: ""; flex: 1; border-top: 1.5px dashed var(--line-strong); }
.ins { font: inherit; font-size: .875rem; font-weight: 600; min-height: 40px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--sea-ink); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.edit-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.edit-foot .btn { flex: 1 1 200px; }
.btn.line { background: transparent; color: var(--muted); border: 1px solid var(--line-strong); }
.btn.sea { background: var(--sea); color: var(--on-sea); border: 0; }
.btn.danger { background: transparent; color: var(--warn-ink); border: 1px solid var(--warn-line); flex: 0 0 auto; padding: 0 16px; }

/* 장소 입력 창 (아래에서 올라오는 판) */
.sheet { width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; margin: auto auto 0; padding: 0; border: 0; border-radius: 22px 22px 0 0; background: var(--surface); color: var(--ink); overflow: auto; overscroll-behavior: contain; }
.sheet::backdrop { background: var(--backdrop); }
.sheet form { display: grid; gap: 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); justify-self: center; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
.x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); color: var(--muted); display: grid; place-items: center; padding: 0; cursor: pointer; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .flabel { font-size: .9rem; font-weight: 600; color: var(--muted); }
.field small { font-weight: 400; color: var(--faint); }
.sheet input[type="text"], .sheet input[type="tel"], .sheet textarea, .sheet select { font: inherit; font-size: 17px; width: 100%; min-height: 50px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); }

const KEY = "jeju-trip-checks";
let checks = new Set();
try { checks = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...checks])); } catch (e) {} };

/* 가족 공유: Firebase Realtime Database (REST + 실시간 스트림). 연결이 안 되면 이 폰에만 저장 */
const SYNC_URL = "https://dasol-jeju-default-rtdb.asia-southeast1.firebasedatabase.app/jeju2026/checks";
const fbKey = id => encodeURIComponent(id.replace(/[.$#\[\]\/]/g, "_"));
let synced = false;
function setSync(on) {
  synced = on;
  const el = document.getElementById("sync-status");
  if (el) el.textContent = on ? "체크 표시가 가족 모두에게 실시간으로 공유돼요." : "체크 표시는 이 휴대폰에만 저장돼요.";
}
function applyRemote(path, data) {
  if (path === "/") {
    checks = new Set();
    if (data) Object.keys(data).forEach(k => { if (data[k] === true) checks.add(decodeURIComponent(k)); });
  } else {
    const k = decodeURIComponent(path.slice(1));
    data === true ? checks.add(k) : checks.delete(k);
  }
  save(); renderDay();
}
function startSync() {
  if (typeof EventSource === "undefined") return;
  let es;
  try { es = new EventSource(SYNC_URL + ".json"); } catch (e) { return; }
  const onData = e => {
    try { const m = JSON.parse(e.data); setSync(true); applyRemote(m.path, m.data); } catch (err) {}
  };
  es.addEventListener("put", onData);
  es.addEventListener("patch", e => {
    try { const m = JSON.parse(e.data); Object.keys(m.data || {}).forEach(k => applyRemote(m.path.replace(/\/$/, "") + "/" + k, m.data[k])); } catch (err) {}
  });
  ["cancel", "auth_revoked"].forEach(t => es.addEventListener(t, () => { es.close(); setSync(false); }));
  es.onerror = () => setSync(false);
}
function pushCheck(id, on) {
  if (!synced) return;
  const url = `${SYNC_URL}/${fbKey(id)}.json`;
  fetch(url, on ? { method: "PUT", body: "true" } : { method: "DELETE" }).catch(() => setSync(false));
}
function pushReset(ids) {
  if (synced) ids.forEach(id => pushCheck(id, false));
}

/* 일정 편집: 바꾼 날만 plan에 담아 이 폰과 Firebase(jeju2026/plan)에 저장. 안 바꾼 날은 위 DAYS 그대로 */
const KINDS = { meal: "식사", cafe: "카페", sight: "구경", shop: "쇼핑" };
const LIM = { id: 40, n: 60, kl: 30, t: 40, note: 300, q: 60, tel: 20, telLabel: 20 };
const clone = o => JSON.parse(JSON.stringify(o));
const BASE = DAYS.map(d => d.stops.map(s => ({ id: s.n, ...s })));
const toArr = v => Array.isArray(v) ? v : v && typeof v === "object" ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : [];
function cleanStop(s) {
  if (!s || typeof s.n !== "string" || !s.n.trim()) return null;
  const o = {};
  Object.keys(LIM).forEach(f => { if (typeof s[f] === "string" && s[f].trim()) o[f] = s[f].trim().slice(0, LIM[f]); });
  o.id = o.id || o.n;
  o.k = KINDS[s.k] ? s.k : "sight";
  if (!o.kl) o.kl = KINDS[o.k];
  if (s.warn === true) o.warn = true;
  return o;
}
const PLAN_KEY = "jeju-trip-plan";
const PLAN_URL = "https://dasol-jeju-default-rtdb.asia-southeast1.firebasedatabase.app/jeju2026/plan";
let plan = {};
try { plan = JSON.parse(localStorage.getItem(PLAN_KEY) || "{}") || {}; } catch (e) {}
const savePlan = () => { try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch (e) {} };
const stopsJson = () => JSON.stringify(DAYS.map(d => d.stops));
function applyPlan() {
  DAYS.forEach((d, i) => {
    const p = plan[d.id];
    d.stops = p && !p.reset ? toArr(p.stops).map(cleanStop).filter(Boolean) : clone(BASE[i]);
  });
}
let lastAt = 0;
const stamp = () => (lastAt = Math.max(Date.now(), lastAt + 1));
function commitDay(i, stops) {
  const id = DAYS[i].id;
  plan[id] = { at: stamp(), stops: stops.map(cleanStop).filter(Boolean), pending: true };
  savePlan(); applyPlan(); pushDay(id);
}
function resetPlanDay(i) {

}

let planSynced = false, remotePlan = null;
const inflight = new Set();
const planNote = () => planSynced ? "바꾼 일정은 가족 모두에게 바로 보여요." : "바꾼 일정은 지금 이 휴대폰에만 저장돼요.";
function setPlanSync(on) {
  planSynced = on;

  if (el) { el.textContent = planNote(); el.classList.toggle("on", on); }

/* 아직 못 보낸 변경(pending)은 연결될 때까지 이 폰에 들고 있다가 보냄 */
function pushDay(id) {
  const p = plan[id];
  if (!p || !p.pending || inflight.has(id)) return;
  inflight.add(id);
  const url = `${PLAN_URL}/${id}.json`;
  fetch(url, p.reset ? { method: "DELETE" } : { method: "PUT", body: JSON.stringify({ at: p.at, stops: p.stops }) })
    .then(r => {
      if (!r.ok) throw new Error(r.status);
      if (plan[id] === p) { if (p.reset) delete plan[id]; else delete p.pending; savePlan(); }
      setPlanSync(true);
    })
    .catch(() => setPlanSync(false))
    .finally(() => { inflight.delete(id); if (plan[id] && plan[id] !== p && plan[id].pending) pushDay(id); });
}
function setAt(root, path, data) {
  const parts = path.split("/").filter(Boolean);
  if (!parts.length) return data;
  if (!root || typeof root !== "object") root = {};
  let o = root;
  parts.slice(0, -1).forEach(p => { if (!o[p] || typeof o[p] !== "object") o[p] = {}; o = o[p]; });
  const last = parts[parts.length - 1];
  if (data === null) delete o[last]; else o[last] = data;
  return root;
}
function onRemotePlan() {
  const r = remotePlan || {};
  DAYS.forEach(d => {
    const loc = plan[d.id], rem = r[d.id];
    if (loc && loc.pending) {
      const same = loc.reset ? !rem : rem && rem.at === loc.at;
      if (!same) { pushDay(d.id); return; }
      if (loc.reset) delete plan[d.id]; else delete loc.pending;
      return;
    }
    if (rem && typeof rem === "object") plan[d.id] = { at: rem.at, stops: clone(toArr(rem.stops)) };

  const before = stopsJson();
  applyPlan();
  if (stopsJson() !== before) renderDay();
}
function startPlanSync() {
  if (typeof EventSource === "undefined") return;
  let es;
  try { es = new EventSource(PLAN_URL + ".json"); } catch (e) { return; }
  es.addEventListener("put", e => {
    try { const m = JSON.parse(e.data); remotePlan = setAt(remotePlan, m.path, m.data); setPlanSync(true); onRemotePlan(); } catch (err) {}
  });
  es.addEventListener("patch", e => {
    try {
      const m = JSON.parse(e.data);
      Object.keys(m.data || {}).forEach(k => { remotePlan = setAt(remotePlan, m.path.replace(/\/$/, "") + "/" + k, m.data[k]); });
      setPlanSync(true); onRemotePlan();
    } catch (err) {}
  });
  ["cancel", "auth_revoked"].forEach(t => es.addEventListener(t, () => { es.close(); setPlanSync(false); }));
  es.onerror = () => setPlanSync(false);
}

}
function deleteStop(i, id) {
  const snap = clone(DAYS[i].stops), s = snap.find(x => x.id === id);
  if (!s) return;
  commitDay(i, snap.filter(x => x.id !== id)); renderDay();
  toast(`‘${s.n}’${josa(s.n, "을", "를")} 지웠어요`, () => { commitDay(i, snap); flashId = id; renderDay(); });
}
dayEl.addEventListener("click", e => {
  const d = DAYS[cur];
  const g = e.target.closest("[data-goto]");
  if (g) { selectDay(+g.dataset.goto); return; }
  if (e.target.closest("[data-edit-toggle]")) {
    editing = !editing; renderDay();
    const target = dayEl.querySelector(editing ? ".edit-banner" : ".list-bar");
    if (target) target.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
    const t = dayEl.querySelector(".list-bar .edit-toggle"); if (t) t.focus({ preventScroll: true });
    return;
  }
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const j = +mv.dataset.move, dir = +mv.dataset.dir, k = j + dir, list = clone(d.stops);
    if (!list[k]) return;
    [list[j], list[k]] = [list[k], list[j]];
    flashId = list[k].id; commitDay(cur, list); renderDay(); focusRow(list[k].id, `[data-dir="${dir}"]`);
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed) { openSheet({ day: cur, id: d.stops[+ed.dataset.edit].id }); return; }
  const ins = e.target.closest("[data-ins]");
  if (ins) { openSheet({ day: cur, at: +ins.dataset.ins }); return; }
  const dl = e.target.closest("[data-del]");
  if (dl) { deleteStop(cur, d.stops[+dl.dataset.del].id); return; }
  if (e.target.closest("[data-restore]")) {
    const i = cur, snap = clone(d.stops);
    resetPlanDay(i); renderDay();
    toast("원래 계획으로 되돌렸어요", () => { commitDay(i, snap); renderDay(); });
    return;
  }
  const b = e.target.closest("[data-check]"); if (!b) return;
  const j = b.dataset.check, fromNext = b.dataset.from === "next";
  const id = `${d.id}-${d.stops[j].id}`;
  const on = !checks.has(id);
  on ? checks.add(id) : checks.delete(id);
  save(); renderDay(); pushCheck(id, on);
  const back = fromNext
    ? (dayEl.querySelector(".next [data-check]") || dayEl.querySelector(".next button"))
    : dayEl.querySelector(`.check[data-check="${j}"]`);
  if (back) back.focus({ preventScroll: true });
});
dayEl.addEventListener("toggle", e => {
  if (e.target.tagName !== "DETAILS") return;
  const id = e.target.id.replace("tips-", "");
  e.target.open ? tipsOpen.add(id) : tipsOpen.delete(id);
}, true);

/* 장소 추가·수정 창 */
const sheet = document.getElementById("sheet"), form = document.getElementById("sheet-form");
const F = name => form.elements[name];
let ctx = null;
function openSheet(c) {
  const s = c.id ? DAYS[c.day].stops.find(x => x.id === c.id) : null;
  if (c.id && !s) return;
  ctx = c;
  form.reset();
  document.getElementById("sheet-title").textContent = s ? "장소 수정" : `${c.at + 1}번째 자리에 추가`;
  F("n").value = s ? s.n : "";
  form.querySelector(`input[name="k"][value="${s ? s.k : "sight"}"]`).checked = true;
  F("t").value = s && s.t || "";
  F("note").value = s && s.note || "";
  F("kl").value = s && s.kl !== KINDS[s.k] ? s.kl : "";
  F("q").value = s && s.q && s.q !== s.n ? s.q : "";
  F("tel").value = s && s.tel || "";
  F("telLabel").value = s && s.telLabel || "";
  F("warn").checked = !!(s && s.warn);
  document.getElementById("f-more").open = !!(s && (F("kl").value || F("q").value || s.tel || s.warn));
  F("day").innerHTML = DAYS.map((d, i) => `<option value="${i}">${dayLabel(i)} · ${esc(d.short)}</option>`).join("");
  F("day").value = String(c.day);
  document.getElementById("f-del").hidden = !s;
  if (sheet.showModal) sheet.showModal(); else sheet.setAttribute("open", "");
  sheet.scrollTop = 0;
  if (!s) F("n").focus();
}
const closeSheet = () => { if (sheet.close) sheet.close(); else sheet.removeAttribute("open"); };
sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest("[data-close]")) closeSheet(); });
document.getElementById("f-del").addEventListener("click", () => { closeSheet(); deleteStop(ctx.day, ctx.id); });
form.addEventListener("submit", e => {
  e.preventDefault();
  const n = F("n").value.trim();
  if (!n) { F("n").focus(); F("n").placeholder = "이름을 적어 주세요"; return; }
  const from = ctx.day, to = +F("day").value;
  const old = ctx.id ? DAYS[from].stops.find(x => x.id === ctx.id) : null;
  const k = form.querySelector('input[name="k"]:checked');
  const s = cleanStop({
    id: ctx.id || newId(), n, k: k && k.value, kl: F("kl").value, t: F("t").value, note: F("note").value,
    q: F("q").value.trim() || (!old || old.q ? n : ""), tel: F("tel").value, telLabel: F("telLabel").value, warn: F("warn").checked
  });
  const src = clone(DAYS[from].stops), j = old ? src.findIndex(x => x.id === ctx.id) : -1;
  if (to === from) {
    if (j >= 0) src[j] = s; else src.splice(Math.min(ctx.at == null ? src.length : ctx.at, src.length), 0, s);
    commitDay(from, src);
  } else {
    if (j >= 0) { src.splice(j, 1); commitDay(from, src); }
    const dst = clone(DAYS[to].stops); dst.push(s); commitDay(to, dst);
  }
  closeSheet();
  flashId = s.id; renderDay();
  if (to !== from) toast(`‘${s.n}’${josa(s.n, "을", "를")} ${dayLabel(to)} 일정 맨 끝에 넣었어요`);
  else focusRow(s.id, "[data-edit]");
});

let armed = false, armTimer;
const resetBtn = document.getElementById("reset");
const disarm = () => { armed = false; resetBtn.textContent = "체크 모두 지우기"; resetBtn.classList.remove("armed"); };
resetBtn.addEventListener("click", () => {
  if (!armed) {
    armed = true; resetBtn.textContent = synced ? "한 번 더 누르면 가족 모두의 체크가 지워져요" : "한 번 더 누르면 지워져요"; resetBtn.classList.add("armed");
    clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000); return;
  }
  clearTimeout(armTimer);
  const ids = [...checks];
  checks.clear(); save(); disarm(); renderDay(); pushReset(ids);
});

applyPlan(); renderTabs(); renderDay(); startSync(); startPlanSync();
</script>
</body></html>
