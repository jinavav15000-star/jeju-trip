.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { font: inherit; font-weight: 600; font-size: 1rem; min-height: 52px; padding: 0 18px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; flex: 1 1 150px; -webkit-tap-highlight-color: transparent; }
.btn.primary { background: var(--accent-fill); color: var(--on-accent); border: 0; }

const KEY = "jeju-trip-checks";
let checks = new Set();
try { checks = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...checks])); } catch (e) {} };

/* 가족 공유: Firebase Realtime Database (REST + 실시간 스트림). 연결이 안 되면 이 폰에만 저장 */
const SYNC_URL = "https://dasol-jeju-default-rtdb.asia-southeast1.firebasedatabase.app/jeju2026/checks";
const fbKey = id => encodeURIComponent(id.replace(/[.$#\[\]\/]/g, "_"));
let synced = false;
function setSync(on) {
  synced = on;
  const el = document.getElementById("sync-status");
  if (el) el.textContent = on ? "체크 표시가 가족 모두에게 실시간으로 공유돼요." : "체크 표시는 이 휴대폰에만 저장돼요.";
}
function applyRemote(path, data) {
  if (path === "/") {
    checks = new Set();
    if (data) Object.keys(data).forEach(k => { if (data[k] === true) checks.add(decodeURIComponent(k)); });
  } else {
    const k = decodeURIComponent(path.slice(1));
    data === true ? checks.add(k) : checks.delete(k);
  }
  save(); renderDay();
}
function startSync() {
  if (typeof EventSource === "undefined") return;
  let es;
  try { es = new EventSource(SYNC_URL + ".json"); } catch (e) { return; }
  const onData = e => {
    try { const m = JSON.parse(e.data); setSync(true); applyRemote(m.path, m.data); } catch (err) {}
  };
  es.addEventListener("put", onData);
  es.addEventListener("patch", e => {
    try { const m = JSON.parse(e.data); Object.keys(m.data || {}).forEach(k => applyRemote(m.path.replace(/\/$/, "") + "/" + k, m.data[k])); } catch (err) {}
  });
  ["cancel", "auth_revoked"].forEach(t => es.addEventListener(t, () => { es.close(); setSync(false); }));
  es.onerror = () => setSync(false);
}
function pushCheck(id, on) {
  if (!synced) return;
  const url = `${SYNC_URL}/${fbKey(id)}.json`;
  fetch(url, on ? { method: "PUT", body: "true" } : { method: "DELETE" }).catch(() => setSync(false));
}
function pushReset(ids) {
  if (synced) ids.forEach(id => pushCheck(id, false));
}

const pad = n => String(n).padStart(2, "0");
const now = new Date();
const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const todayIdx = DAYS.findIndex(d => d.date === todayStr);

const hashIdx = () => DAYS.findIndex(d => d.id === location.hash.replace("#", ""));
function startIdx() {
  const byHash = hashIdx();
  if (byHash >= 0) return byHash;
  if (todayIdx >= 0) return todayIdx;
  return todayStr > DAYS[DAYS.length - 1].date ? DAYS.length - 1 : 0;
}
let cur = startIdx();
try { const s = sessionStorage.getItem("jeju-tab"); if (s !== null && !location.hash && DAYS[+s]) cur = +s; } catch (e) {}

const mapUrl = q => "https://map.kakao.com/link/search/" + encodeURIComponent(q);

/* "08:00 아침 오픈" → 큰 시각 + 설명, "일몰 약 17:45" → "약 17:45" + "일몰" */
function splitKey(k) {
  const m = k.match(/(약\s*)?(\d{1,2}:\d{2})/);
  if (!m) return { t: "", l: k };
  const t = (m[1] ? "약 " : "") + m[2];
  return { t, l: (k.slice(0, m.index) + k.slice(m.index + m[0].length)).replace(/\s+/g, " ").trim() };
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = DAYS.map((d, i) => {
    const [, m, dd] = d.date.split("-");
    const sel = i === cur;
    return `<button class="tab" role="tab" id="tab-${d.id}" aria-selected="${sel}" aria-controls="day" tabindex="${sel ? 0 : -1}" data-i="${i}" type="button">
      <b>${+m}/${+dd} ${d.dow}</b><span>${i === todayIdx ? '<span class="today">오늘</span> · ' : ""}${esc(d.short)}</span>
    </button>`;
  }).join("");
  document.getElementById("day").setAttribute("aria-labelledby", `tab-${DAYS[cur].id}`);
}

function noteHtml(s) {
  if (!s.note) return "";
  return s.warn
    ? `<p class="note warn">${I.clock}<span>${esc(s.note)}</span></p>`
    : `<p class="note">${esc(s.note)}</p>`;
}

function renderDay() {
  const d = DAYS[cur];
  const sid = j => `${d.id}-${d.stops[j].n}`;
  const nextJ = d.stops.findIndex((s, j) => !checks.has(sid(j)));
  const nx = d.stops[nextJ];
  const [, m, dd] = d.date.split("-");
  const cut = d.title.indexOf(" · ");
  const region = cut > 0 ? d.title.slice(0, cut) : d.title;
  const route = cut > 0 ? d.title.slice(cut + 3) : "";
  const total = d.stops.length;

  const prog = `<div class="prog" aria-hidden="true">${d.stops.map((s, j) =>
    `<i class="${checks.has(sid(j)) ? "on" : j === nextJ ? "cur" : ""}"></i>`).join("")}</div>`;

  const nextCard = nextJ < 0
    ? `<section class="next alldone" aria-live="polite">
        <div class="next-top"><span class="next-label">오늘 일정</span><span class="next-count">${total} / ${total}</span></div>

        ${cur < DAYS.length - 1 ? `<div class="actions"><button class="btn ghost" type="button" data-goto="${cur + 1}">다음 날 일정 보기</button></div>` : ""}
      </section>`
    : `<section class="next" aria-live="polite" aria-label="다음 갈 곳">
        <div class="next-top"><span class="next-label">다음 갈 곳</span><span class="next-count">${nextJ + 1}번째 / ${total}곳</span></div>
        ${prog}
        <h3 class="next-name">${esc(nx.n)}</h3>
        <div class="next-meta">
          ${nx.t ? `<span class="time ${nx.warn ? "warn" : ""}">${esc(nx.t)}</span>` : ""}
          <span class="cat ${nx.k}">${esc(nx.kl)}</span>
        </div>
        ${noteHtml(nx)}
        <div class="actions">
          ${nx.q ? `<a class="btn primary" href="${mapUrl(nx.q)}" target="_blank" rel="noopener">${I.pin}카카오맵 열기</a>` : ""}
          ${nx.tel ? `<a class="btn ghost" href="${telHref(nx.tel)}">${I.phone}${esc(nx.telLabel || "전화")}</a>` : ""}
          <button class="btn ghost" type="button" data-check="${nextJ}" data-from="next">${I.check}다녀왔어요</button>
        </div>
      </section>`;

  document.getElementById("day").innerHTML = `
    <section class="day-head">
      <p class="eyebrow">${cur + 1}일차 · ${+m}월 ${+dd}일 ${esc(d.dow)}요일</p>
      <h2>${esc(region)}</h2>
      ${route ? `<p class="route">${esc(route).replace(/→/g, '<span class="arr" aria-label="다음">→</span>')}</p>` : ""}
      <ul class="keys" aria-label="오늘 중요한 시간">${d.keys.map(k => {
        const { t, l } = splitKey(k);
        return t ? `<li><span class="kt">${esc(t)}</span><span class="kl">${esc(l)}</span></li>`
                 : `<li class="notime"><span class="kl">${esc(l)}</span></li>`;
      }).join("")}</ul>
    </section>
    ${nextCard}
    <h3 class="list-head">전체 일정 ${total}곳</h3>
    <ol class="stops">
      ${d.stops.map((s, j) => {
        const done = checks.has(sid(j));
        return `
        <li class="stop ${done ? "done" : ""} ${j === nextJ ? "is-next" : ""}">
          <span class="num" aria-hidden="true">${j + 1}</span>
          <div class="body">
            <span class="name">${esc(s.n)}</span>
            <div class="meta"><span class="cat ${s.k}">${esc(s.kl)}</span>${s.t ? `<span class="time ${s.warn ? "warn" : ""}">${esc(s.t)}</span>` : ""}</div>
            ${noteHtml(s)}
            ${s.q || s.tel ? `<div class="links">${s.q ? `<a class="maplink" href="${mapUrl(s.q)}" target="_blank" rel="noopener" aria-label="${esc(s.n)} 카카오맵 열기">${I.pin}지도</a>` : ""}${s.tel ? `<a class="maplink tel" href="${telHref(s.tel)}" aria-label="${esc(s.telLabel || s.n)} 전화 ${esc(s.tel)}">${I.phone}${esc(s.telLabel || "전화")} <span class="num-text">${esc(s.tel)}</span></a>` : ""}</div>` : ""}
          </div>

    </ol>

    </details>`;
}

function selectDay(i, focusTab) {
  if (!DAYS[i]) return;
  cur = i;
  try { sessionStorage.setItem("jeju-tab", cur); } catch (err) {}
  renderTabs(); renderDay();
  if (focusTab) document.getElementById(`tab-${DAYS[cur].id}`).focus();
  window.scrollTo({ top: 0 });
}

});
tabsEl.addEventListener("keydown", e => {
  const map = { ArrowRight: cur + 1, ArrowLeft: cur - 1, Home: 0, End: DAYS.length - 1 };
  if (!(e.key in map)) return;
  e.preventDefault();
  selectDay((map[e.key] + DAYS.length) % DAYS.length, true);
});
window.addEventListener("hashchange", () => { const i = hashIdx(); if (i >= 0) selectDay(i); });

const dayEl = document.getElementById("day");
dayEl.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]");
  if (g) { selectDay(+g.dataset.goto); return; }
  const b = e.target.closest("[data-check]"); if (!b) return;
  const j = b.dataset.check, fromNext = b.dataset.from === "next";
  const id = `${DAYS[cur].id}-${DAYS[cur].stops[j].n}`;
  const on = !checks.has(id);
  on ? checks.add(id) : checks.delete(id);
  save(); renderDay(); pushCheck(id, on);
  const back = fromNext
    ? (dayEl.querySelector(".next [data-check]") || dayEl.querySelector(".next button"))
    : dayEl.querySelector(`.check[data-check="${j}"]`);
  if (back) back.focus({ preventScroll: true });
});
dayEl.addEventListener("toggle", e => {
  if (e.target.tagName !== "DETAILS") return;
  const id = e.target.id.replace("tips-", "");
  e.target.open ? tipsOpen.add(id) : tipsOpen.delete(id);
}, true);

let armed = false, armTimer;
const resetBtn = document.getElementById("reset");
const disarm = () => { armed = false; resetBtn.textContent = "체크 모두 지우기"; resetBtn.classList.remove("armed"); };
resetBtn.addEventListener("click", () => {
  if (!armed) {
    armed = true; resetBtn.textContent = synced ? "한 번 더 누르면 가족 모두의 체크가 지워져요" : "한 번 더 누르면 지워져요"; resetBtn.classList.add("armed");
    clearTimeout(armTimer); armTimer = setTimeout(disarm, 3000); return;
  }
  clearTimeout(armTimer);
  const ids = [...checks];
  checks.clear(); save(); disarm(); renderDay(); pushReset(ids);
});

renderTabs(); renderDay(); startSync();
</script>
</body>
</html>
